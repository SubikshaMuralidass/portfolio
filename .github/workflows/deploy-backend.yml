name: Deploy FastAPI Backend

on:
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create deployment package
        run: |
          cd backend
          zip -r ../backend.zip . -x "*.pyc" "__pycache__/*" ".env"

      - name: Upload deployment artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend
          path: backend.zip

  deploy:
    runs-on: ubuntu-latest
    needs: build

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download deployment artifact
        uses: actions/download-artifact@v4
        with:
          name: backend

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_E1D3D499045F4F5F9970EF12BD330AAE }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_964965642CD747988C02822ACC58DFFB }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_6FDF140ED495418985851E2877EF1876 }}

      - name: Deploy FastAPI backend
        uses: azure/webapps-deploy@v3
        with:
          app-name: subiksha-portfolio-api
          package: backend.zip